name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  GO_VERSION: '1.24.2'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Build application
        run: make build

  build:
    name: Build for all platforms
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: make deps

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          go build \
            -ldflags="-s -w -X 'main.Version=$VERSION' -X 'main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o facade-${{ matrix.suffix }} \
            cmd/facade/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: facade-${{ matrix.suffix }}
          path: facade-${{ matrix.suffix }}

  release:
    name: Create Release Draft
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --format="- %s (%h)")
          else
            COMMITS=$(git log --oneline --format="- %s (%h)" $LAST_TAG..HEAD)
          fi
          
          cat << EOF > CHANGELOG.md
          ## 🚀 What's New
          
          $COMMITS
          
          ## 📦 Installation
          
          ### Download binary
          Download the appropriate binary for your platform from the assets below.
          
          ### Build from source
          \`\`\`bash
          git clone https://github.com/ShiftyX1/Facade.git
          cd Facade
          make build
          \`\`\`
          
          ### Docker
          \`\`\`bash
          docker run -p 8080:8080 ghcr.io/shiftyx1/facade:latest
          \`\`\`
          
          ## 🎯 Usage
          
          \`\`\`bash
          # Download and run
          chmod +x facade-*
          ./facade-linux-amd64 -c configs/example.yaml
          
          # Or use make commands
          make run
          \`\`\`
          
          ## 🧪 Testing
          
          \`\`\`bash
          # Health check
          curl http://localhost:8080/_facade/health
          
          # Get users
          curl http://localhost:8080/users
          \`\`\`
          EOF
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          find artifacts -name "facade-*" -type f -exec cp {} release-assets/ \;
          
          cd release-assets
          
          # Linux AMD64
          if [ -f "facade-linux-amd64" ]; then
            tar czf facade-linux-amd64.tar.gz facade-linux-amd64
            rm facade-linux-amd64
          fi
          
          # Linux ARM64
          if [ -f "facade-linux-arm64" ]; then
            tar czf facade-linux-arm64.tar.gz facade-linux-arm64
            rm facade-linux-arm64
          fi
          
          # Darwin AMD64
          if [ -f "facade-darwin-amd64" ]; then
            tar czf facade-darwin-amd64.tar.gz facade-darwin-amd64
            rm facade-darwin-amd64
          fi
          
          # Darwin ARM64
          if [ -f "facade-darwin-arm64" ]; then
            tar czf facade-darwin-arm64.tar.gz facade-darwin-arm64
            rm facade-darwin-arm64
          fi
          
          # Windows
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Facade ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Draft Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Draft (review and publish manually)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built for platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- Linux (AMD64, ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (Intel, Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows (AMD64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [Releases](https://github.com/ShiftyX1/Facade/releases)" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the draft release" >> $GITHUB_STEP_SUMMARY
          echo "3. Edit description if needed" >> $GITHUB_STEP_SUMMARY
          echo "4. Publish the release" >> $GITHUB_STEP_SUMMARY
